name: Cleanup Pending Orders (Test)

on:
  schedule:
    # Туршилтад минут тутам ажиллана (GitHub Actions нь хамгийн багадаа 5 минут тутам дэмждэг)
    - cron: '*/5 * * * *'
  workflow_dispatch: # гараар ч ажиллуулах боломжтой

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Call cleanup orders API
        run: |
          echo "📦 Cleaning up pending orders..."
          curl -s -X GET $CLEANUP_API_URL
        env:
          CLEANUP_API_URL: ${{ secrets.CLEANUP_API_URL }}
